[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nir-core"
version = "0.1.0"
description = "Deterministic NIR spectroscopy algorithms for the NIR Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NIR-Agent" }]
dependencies = [
    "chemotools==0.4.4",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
    "pydantic>=2.0.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
mat73 = ["h5py>=3.8.0"]
ensemble = ["xgboost>=1.7.0", "lightgbm>=3.3.0"]
deep = ["torch>=2.0.0"]
mcp = ["mcp==1.27.0"]
knowledge = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.0",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "markdownify>=0.11",
    "langchain-community>=0.0.20",
]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.14.11"]

[project.scripts]
chemotools-mcp = "nir_core.chemotools_mcp.chemotools_server:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = [".."]
include = ["nir_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: compute-intensive model training, selection, or persistence regression",
]
